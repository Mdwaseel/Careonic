{% extends 'app/base.html' %}
{% block title %}Complete Payment{% endblock %}

{% block content %}
<style>
    .payment-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 500px;
        margin: auto;
        position: relative;
        overflow: hidden;
    }
    
    .payment-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 8px;
        background: linear-gradient(90deg, #396afc, #2948ff);
    }

    .payment-amount {
        font-size: 3rem;
        font-weight: 800;
        color: #2c3e50;
        margin: 20px 0;
    }
    
    .payment-amount span {
        font-size: 1.5rem;
        vertical-align: super;
        color: #7f8c8d;
    }
    
    .doctor-badge {
        display: inline-block;
        background: #f1f4f8;
        color: #396afc;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 10px;
    }

    .pay-btn {
        background: linear-gradient(135deg, #396afc, #2948ff);
        border: none;
        padding: 15px 30px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 12px;
        width: 100%;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(57, 106, 252, 0.3);
    }
    
    .pay-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(57, 106, 252, 0.4);
    }
</style>

<div class="container mt-5 mb-5">
    <div class="payment-card">
        <div class="mb-4">
            <i class="fas fa-shield-alt fa-3x text-success opacity-75"></i>
        </div>
        <h3 class="mb-2" style="font-weight: 700; color: #2c3e50;">Complete Your Booking</h3>
        <p class="text-muted mb-4">Secure payment for your appointment</p>
        
        <div class="doctor-badge">
            <i class="fas fa-user-md me-2"></i>{{ appointment.doctor }}
        </div>
        
        <div class="payment-amount">
            <span>₹</span>50
        </div>
        
        <form action="{% url 'verify_payment' %}" method="POST" id="razorpay-form">
            {% csrf_token %}
            <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
            <input type="hidden" name="razorpay_order_id" id="razorpay_order_id" value="{{ order_id }}">
            <input type="hidden" name="razorpay_signature" id="razorpay_signature">
        </form>
        
        <button id="rzp-button1" class="btn btn-primary pay-btn mt-4">
            <i class="fas fa-lock me-2"></i> Pay Securely
        </button>
        
        <p class="text-muted mt-4 mb-0" style="font-size: 0.8rem;">
            <i class="fas fa-info-circle me-1"></i> Payments are securely processed (Simulated for testing)
        </p>
    </div>
</div>

<script>
document.getElementById('rzp-button1').onclick = function(e){
    e.preventDefault();
    alert("Payment Successful! Your appointment is confirmed.");
    document.getElementById('razorpay_payment_id').value = "pay_test_" + Math.random().toString(36).substr(2, 9);
    document.getElementById('razorpay_signature').value = "sig_test_" + Math.random().toString(36).substr(2, 9);
    document.getElementById('razorpay-form').submit();
}
</script>
{% endblock %}
